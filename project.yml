name: PicklePark
options:
  bundleIdPrefix: com.dominicsoriano
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: "5Q77AM8FH4"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  PicklePark:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PicklePark
    settings:
      base:
        PRODUCT_NAME: PicklePark
        PRODUCT_BUNDLE_IDENTIFIER: com.dominicsoriano.washingpark
        INFOPLIST_FILE: PicklePark/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PicklePark/Resources/PicklePark.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "5Q77AM8FH4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 12
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES

  PickleBracket:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PickleBracket
    settings:
      base:
        PRODUCT_NAME: PickleBracket
        PRODUCT_BUNDLE_IDENTIFIER: com.dominicsoriano.picklebracket
        INFOPLIST_FILE: PickleBracket/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "5Q77AM8FH4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES
